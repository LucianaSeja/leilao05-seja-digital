# EXEMPLO - NAO colocar segredos reais neste arquivo nem no GitHub.
# Os valores reais ficam so em: Streamlit Cloud > app > Settings > Secrets.
# Copie o bloco [dropbox] dos Secrets do app pdb2027 (app_key, app_secret, refresh_token,
# root_namespace_id) e troque xlsx_path por estado_path.
[dropbox]
app_key = "..."
app_secret = "..."
refresh_token = "..."
root_namespace_id = "..."          # so se o pdb2027 usa
estado_path = "/CAMINHO/NO/DROPBOX/leilao_estado.json"   # arquivo pequeno que guarda "iniciado"

[acesso]
diretores = ["email.do.diretor@sejadigital.com.br"]       # quem ve o botao INICIAR (vazio = todos os liberados)
